<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
      background-image: url('/image/cover.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Courier, monospace;
      image-rendering: crisp-edges; 
      image-rendering: -webkit-optimize-contrast;
    }
    .signup-card {
      background-color: rgba(255, 255, 255, 0.8); 
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }
    </style>
</head>
<body>
    <div class="signup-card">
        <h1 style="text-align: center; color: #333; font-size: 24px; font-family: Courier, monospace;">Login</h1>
        <form action="" style="display: flex; flex-direction: column; align-items: center;"></form>
        
        <div style="display: flex; flex-direction: column; margin-bottom: 10px;">
            <label for="Email" style="margin-bottom: 5px;">Email:</label>
            <input type="text" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="display: flex; flex-direction: column; margin-bottom: 10px;">
            <label for="password" style="margin-bottom: 5px;">Password:</label>
            <input type="password" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <button style="background-color: #5F9EA0; color: #F0F8FF; border: 1px solid #ccc; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 10px;">
            <a href="./home.html" style="text-decoration: none; color: white;">Login</a></button>
       <p style="text-align: center; margin-top: 10px;">Don't have an account? </p>
       <a href="./signup.html" style="color: #5F9EA0; text-decoration: none;">Sign up</a>
     
    </div>
    
</body>
</html>
