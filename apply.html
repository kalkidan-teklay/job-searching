<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <h1 style="text-align: center; color: #333; font-size: 24px; font-family: Courier, monospace;"> Submit An Application</h1>
    <a href="./appliedJobs.html">View applications</a>
    <form action="" style="display: flex; flex-direction: column; background-color: #f9f9f9; margin: 25px; padding: 25px;" >
        <label for="name" style="margin-bottom: 10px;"> Full name:</label>
        <input type="text" required, style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px;"><br>
        <label for="name" style="margin-bottom: 10px;"> Address:</label>
        <input type="text" required, style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px;"><br>
        <label for="name" style="margin-bottom: 10px;"> Email Address:</label>
        <input type="text" required, style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px;"><br>
        <label for="name" style="margin-bottom: 10px;"> Relevant Experience:</label>
        <input type="text" required, style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; height: 100px"><br>
        <label for="name" style="margin-bottom: 10px;"> Cover Letter</label>
        <input type="text" required, style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; height: 500px; "><br>
        <p>Upload your Resume <i class="fa-solid fa-upload"></i></p>
        <button style="background-color: #5F9EA0; color: #F0F8FF; border: 1px solid #ccc; padding: 8px 16px; margin-left: 65px; margin-right: 65px; border-radius: 4px; cursor: pointer;">Submit</button>
    </form>
</body>
</html>
